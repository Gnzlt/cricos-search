name: Refresh CRICOS data

on:
  schedule:
    - cron: "0 6 3 * *" # the 3rd of each month, after the department's monthly update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/fetch-data.mjs
      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            date=$(node -p "require('./public/data/meta.json').sourceDate")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Data: CRICOS as at $date"
            git push
          else
            echo "No data changes"
          fi
